    :root {
      --bg: #ffffff;
      --fg: #000000;
      --accent: #c62828;
      --text: "Spectral", Georgia, "Noto Serif", serif;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #000000; --fg: #ffffff; --accent: #ef5350; }
    }
    :root[data-theme="dark"] { --bg: #000000; --fg: #ffffff; --accent: #ef5350; }
    html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
    *, *::before, *::after { box-sizing: inherit; }

    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--text);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .wrap {
      height: 100%;
      max-width: 440px;
      margin: 0 auto;
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
    }

    .cardBtn {
      appearance: none;
      display: block;
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
    }
    .cardBtn svg { display: block; width: 100%; height: 100%; }

    .status {
      flex: 0 0 auto;
      margin: 12px 0 0;
      min-height: 2.8em;
      font-size: 17px;
      line-height: 1.4;
      font-weight: 500;
      text-align: center;
    }

    .draw {
      appearance: none;
      flex: 0 0 auto;
      width: 100%;
      min-height: 56px;
      margin-top: 10px;
      padding: 12px;
      border: 3px solid var(--fg);
      border-radius: 10px;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--text);
      font-weight: 700;
      font-size: 19px;
      cursor: pointer;
    }
    .draw:active, .draw.holding { border-width: 6px; padding: 9px; }
    .draw, .cardBtn { touch-action: none; -webkit-touch-callout: none; }
    .draw:focus-visible, .cardBtn:focus-visible { outline: 3px dashed var(--fg); outline-offset: 3px; }

    .s  { fill: none; stroke: var(--fg); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .t  { fill: none; stroke: var(--fg); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .k  { stroke-width: 5; }
    .f  { fill: var(--fg); stroke: var(--fg); stroke-width: 1.5; }
    .w  { fill: var(--bg); stroke: var(--fg); stroke-width: 2.5; stroke-linejoin: round; }
    .h  { fill: url(#hatch); stroke: var(--fg); stroke-width: 2.5; }
    .a  { fill: var(--accent); stroke: var(--fg); stroke-width: 2; }
    .as { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .route { fill: none; stroke: var(--fg); stroke-width: 1.5; stroke-dasharray: 4 5; stroke-linecap: round; }
    .pt { font-family: var(--text); font-weight: 500; fill: var(--fg); text-anchor: middle; }
    .lbl { font-family: var(--text); font-weight: 700; fill: var(--fg); text-anchor: middle; }
  </style>
</head>
<body>
  <div class="wrap">
    <button class="cardBtn" id="cardBtn" type="button" aria-label="Card"></button>
    <p class="status" id="status" aria-live="polite">Hold to shuffle. Let go when it feels right, then turn the card over.</p>
    <button class="draw" id="drawBtn" type="button">Hold to shuffle</button>
  </div>

  <script>
    const prompts = [
      "Start from the part you were saving for last.",
      "Make the quiet part carry the weight.",
      "Remove the thing you are proudest of.",
      "Let the mistake set the key.",
      "Finish it badly, then decide.",
      "What is this hiding from?",
      "Change the scale. Keep the gesture.",
      "Borrow the rules of a different trade.",
      "Make one more version without looking at the last.",
      "Describe it to someone who will never see it.",
      "Leave a door open.",
      "Which part would survive a fire?",
      "Trade precision for weather.",
      "Put the ending in the middle.",
      "Let a constraint choose for you.",
      "Turn the margin into the center.",
      "Find the joke inside the serious part.",
      "Find the serious part inside the joke.",
      "Stop while it is still slightly wrong.",
      "Use only what is within reach.",
      "Make the transition the subject.",
      "Count the decisions. Undo half.",
      "What would the materials prefer?",
      "Give the background a voice.",
      "Copy yourself from a year ago.",
      "Make it louder in one place only.",
      "Subtract until it breaks, then put one thing back.",
      "Trust the instinct you dismissed first.",
      "Whose permission are you waiting for?",
      "Shrink the audience to one person.",
      "Let it be unfinished in public.",
      "Walk away and come back as a stranger.",
      "Treat the error message as an instruction.",
      "Swap the foreground and the frame.",
      "Keep only the verbs.",
      "Make the obvious choice on purpose.",
      "Sketch it in a medium you are bad at.",
      "What does the deadline actually require?",
      "Say it in half the time.",
      "Let one accident stay.",
      "Pick three ingredients. No more.",
      "What changed since you started?",
      "Follow the tangent for ten minutes.",
      "Leave room for someone else to finish it.",
      "The first sketch knew something. Find it.",
      "Remove the explanation.",
      "What is the cheapest possible version?",
      "Rest is part of the rhythm.",
      "Ask what it needs, not what you want.",
      "Set a timer. Stop when it rings.",
      "Translate it into another sense.",
      "Look at it from the floor.",
      "Name what you are avoiding.",
      "Let the tool lead for a while.",
      "Make the hard part easy and the easy part hard.",
      "Which detail would you defend?",
      "Show the scaffolding.",
      "Hide the seams."
    ];
    const N = prompts.length;

    const P = (d, c = "s") => `<path d="${d}" class="${c}"/>`;
    const C = (x, y, r, c = "s") => `<circle cx="${x}" cy="${y}" r="${r}" class="${c}"/>`;
    const L = (x1, y1, x2, y2, c = "s") => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}"/>`;
    const R = (x, y, w, h, c = "s", rx = 0) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" class="${c}"/>`;
    const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

    const defs = `<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" style="fill:var(--bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--fg);stroke-width:2"/></pattern></defs>`;

    function seeded(n) {
      let a = (n * 2654435761 + 1013904223) >>> 0;
      return () => {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // Each prompt gets a fixed mark: a 3x3 grid of simple shapes, a dashed route through some of them, one red cell
    function sigil(i) {
      const rnd = seeded(i + 1);
      const cells = [];
      for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) cells.push([114 + c * 36, 92 + r * 36]);
      const kinds = cells.map(() => Math.floor(rnd() * 9));
      let filled = kinds.filter(k => k !== 6).length;
      for (let j = 0; filled < 5 && j < 9; j++) if (kinds[j] === 6) { kinds[j] = j % 5; filled++; }
      const order = cells.map((_, j) => j).sort(() => rnd() - 0.5).slice(0, 4);
      const route = P("M" + order.map(j => cells[j].join(" ")).join(" L"), "route");
      const accentCell = order[Math.floor(rnd() * order.length)];
      let marks = "";
      cells.forEach(([x, y], j) => {
        if (j === accentCell) { marks += C(x, y, 12, "a"); return; }
        switch (kinds[j]) {
          case 0: marks += C(x, y, 5, "f"); break;
          case 1: marks += C(x, y, 12, "w"); break;
          case 2: marks += L(x - 12, y, x + 12, y); break;
          case 3: marks += L(x - 10, y + 10, x + 10, y - 10); break;
          case 4: marks += R(x - 10, y - 10, 20, 20, "w"); break;
          case 5: marks += P(`M${x - 12} ${y + 4} A 12 12 0 0 1 ${x + 12} ${y + 4} Z`, "w"); break;
          case 7: marks += L(x - 8, y, x + 8, y) + L(x, y - 8, x, y + 8); break;
          case 8: marks += C(x, y, 12, "h"); break;
        }
      });
      return route + marks;
    }

    const measureCtx = document.createElement("canvas").getContext("2d");
    function wrapLines(text, size, maxW) {
      measureCtx.font = `500 ${size}px Spectral, Georgia, serif`;
      const words = text.split(" "), lines = [];
      let line = "";
      for (const w of words) {
        const test = line ? line + " " + w : w;
        if (measureCtx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
        else line = test;
      }
      if (line) lines.push(line);
      return lines;
    }

    // Largest type size whose wrapped lines fit the text block
    function setPrompt(text) {
      const maxW = 228, maxH = 168;
      for (let size = 34; size >= 18; size -= 2) {
        const lines = wrapLines(text, size, maxW);
        const lh = size * 1.25;
        if (lines.length * lh <= maxH) {
          const top = 238 + (maxH - lines.length * lh) / 2 + size * 0.85;
          return `<text class="pt" font-size="${size}">` +
            lines.map((ln, k) => `<tspan x="150" y="${(top + k * lh).toFixed(1)}">${esc(ln)}</tspan>`).join("") +
            `</text>`;
        }
      }
      return "";
    }

    function faceSVG(i) {
      return `<svg viewBox="0 0 300 460" role="img" aria-label="${esc(prompts[i])}" xmlns="http://www.w3.org/2000/svg">${defs}
        ${R(3, 3, 294, 454, "w", 14)}${R(14, 14, 272, 432, "t", 8)}
        ${sigil(i)}
        ${L(110, 212, 190, 212, "t")}
        ${setPrompt(prompts[i])}
        <text x="150" y="428" font-size="14" class="lbl">${i + 1} / ${N}</text>
      </svg>`;
    }

    // Card back: a straight path that takes a detour
    function backSVG(label) {
      return `<svg viewBox="0 0 300 460" role="img" aria-label="Card back" xmlns="http://www.w3.org/2000/svg">${defs}
        ${R(3, 3, 294, 454, "w", 14)}
        ${R(14, 14, 272, 432, "h", 8)}
        ${R(40, 150, 220, 150, "w", 10)}
        ${P("M14 225 L110 225 L110 175 C 110 165 118 160 126 160 L200 160 C 210 160 216 168 216 178 L216 262 C 216 272 210 280 200 280 L170 280 C 160 280 154 272 154 262 L154 225 L286 225", "s k")}
        ${C(216, 220, 11, "a")}
        ${R(80, 384, 140, 40, "w", 8)}
        <text x="150" y="410" font-size="17" class="lbl">${label}</text>
      </svg>`;
    }

    const cardBtn = document.getElementById("cardBtn");
    const drawBtn = document.getElementById("drawBtn");
    const statusEl = document.getElementById("status");

    const RIFFLE_MS = 220;
    const MIN_RIFFLES = 3;
    const STORE = "detours-deck-order";

    function loadOrder() {
      try {
        const o = JSON.parse(localStorage.getItem(STORE));
        if (Array.isArray(o) && o.length === N && new Set(o).size === N &&
            o.every(n => Number.isInteger(n) && n >= 0 && n < N)) return o;
      } catch (e) {}
      return prompts.map((_, i) => i);
    }
    function saveOrder() {
      try { localStorage.setItem(STORE, JSON.stringify(deckOrder)); } catch (e) {}
    }

    function riffle(order) {
      let cut = 0;
      for (let i = 0; i < order.length; i++) if (Math.random() < 0.5) cut++;
      const a = order.slice(0, cut), b = order.slice(cut), out = [];
      while (a.length || b.length) {
        out.push(Math.random() * (a.length + b.length) < a.length ? a.shift() : b.shift());
      }
      return out;
    }

    const buzz = pattern => { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {} };

    let deckOrder = loadOrder();
    let state = "idle";
    let timer = null, riffles = 0, revealArmed = false;

    const showBack = label => { cardBtn.innerHTML = backSVG(label); };

    function startShuffle() {
      if (state === "shuffling") return;
      state = "shuffling";
      riffles = 0;
      revealArmed = false;
      showBack("Shuffling");
      drawBtn.classList.add("holding");
      drawBtn.textContent = "Shuffling…";
      timer = setInterval(() => {
        deckOrder = riffle(deckOrder);
        riffles++;
        drawBtn.textContent = `Shuffling · ${riffles}`;
        buzz(8);
      }, RIFFLE_MS);
    }

    function stopShuffle() {
      if (state !== "shuffling") return;
      clearInterval(timer);
      timer = null;
      drawBtn.classList.remove("holding");
      saveOrder();
      if (riffles < MIN_RIFFLES) {
        state = "idle";
        showBack("Detours");
        drawBtn.textContent = "Hold to shuffle";
        statusEl.textContent = "Hold a little longer, and let go when it feels right.";
        return;
      }
      state = "pulled";
      buzz(25);
      showBack("Tap to turn");
      drawBtn.textContent = "Hold to shuffle again";
      statusEl.textContent = `You stopped after ${riffles} riffles. Tap the card to turn it over.`;
    }

    function reveal() {
      const i = deckOrder[0];
      cardBtn.innerHTML = faceSVG(i);
      deckOrder = deckOrder.slice(1).concat(i);
      saveOrder();
      state = "revealed";
      buzz([20, 40, 20]);
      drawBtn.textContent = "Hold to shuffle";
      statusEl.textContent = "Apply it to whatever you are working on, even if it seems not to fit.";
    }

    function bindHold(el, isCard) {
      el.addEventListener("pointerdown", e => {
        if (isCard && state === "pulled") { revealArmed = true; return; }
        if (el.setPointerCapture) el.setPointerCapture(e.pointerId);
        startShuffle();
      });
      const end = () => {
        if (isCard && state === "pulled" && revealArmed) { revealArmed = false; reveal(); return; }
        stopShuffle();
      };
      el.addEventListener("pointerup", end);
      el.addEventListener("pointercancel", end);
      el.addEventListener("contextmenu", e => e.preventDefault());
    }

    bindHold(drawBtn, false);
    bindHold(cardBtn, true);

    drawBtn.addEventListener("keydown", e => {
      if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); startShuffle(); }
    });
    drawBtn.addEventListener("keyup", e => {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); stopShuffle(); }
    });
    cardBtn.addEventListener("keydown", e => {
      if ((e.key === " " || e.key === "Enter") && state === "pulled") { e.preventDefault(); reveal(); }
    });

    showBack("Detours");
    if (document.fonts && document.fonts.load) document.fonts.load('500 30px "Spectral"');

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
